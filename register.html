<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Register - Landlord Lite</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background: linear-gradient(
      180deg,
      #2e7d32 0%,
      #4caf60 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .box {
    background: white;
    width: 100%;
    max-width: 680px;

    padding: 55px 50px;
    border-radius: 24px;

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
  }

  h2 {
    margin: 0 0 40px 0;

    text-align: center;
    font-size: 38px;
    color: #2e7d32;
  }

  input {
    display: block;
    width: 100%;

    padding: 20px 22px;
    margin-bottom: 24px;

    font-size: 24px;

    border: 1px solid #bbb;
    border-radius: 14px;
    outline: none;
  }

  input:focus {
    border-color: #2e7d32;
  }

  button {
    width: 100%;

    padding: 20px;
    margin-top: 4px;

    border: none;
    border-radius: 14px;

    background: #2e7d32;
    color: white;

    font-size: 24px;
    font-weight: bold;

    cursor: pointer;
  }

  button:hover {
    background: #256b29;
  }

  .box p {
    text-align: center;
    font-size: 22px;
    margin-top: 40px;
    margin-bottom: 0;
  }

  .box a {
    color: #2e7d32;
  }

  @media (max-width: 600px) {
    body {
      padding: 12px;
    }

    .box {
      padding: 50px 35px;
      border-radius: 24px;
    }

    h2 {
      font-size: 36px;
    }

    input {
      font-size: 22px;
      padding: 19px;
    }

    button {
      font-size: 23px;
      padding: 19px;
    }

    .box p {
      font-size: 20px;
    }
  }
</style>  <link rel="stylesheet" href="sidebar.css">
</head>
<body>

<div class="box">

<h2>Registrieren</h2>

<form id="registerForm">

<input type="email" id="email" placeholder="Email" required>

<input type="password" id="password" placeholder="Passwort" required>

<button type="submit">Account erstellen</button>

</form>

<div id="msg" class="msg"></div>

<div class="link">
<a href="login.html">Schon ein Account? Login</a>
</div>

</div>

<script src="config.js"></script>
<script>
const registerForm = document.getElementById("registerForm");
const msg = document.getElementById("msg");

registerForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  msg.textContent = "";
  msg.style.color = "red";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const res = await fetch(window.AUTH_BASE + "/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.error || "Registrierung fehlgeschlagen";
      return;
    }

    localStorage.setItem("token", data.token);
    window.location.replace("./index.html");
  } catch (err) {
    msg.textContent = "Server Fehler: " + err.message;
  }
});
</script>
  <script src="sidebar.js"></script>
</body>
</html>
